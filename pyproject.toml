[project]
name = "agent_smith"
requires-python = ">=3.13"
version = "0.1.0"
dependencies = [
    "pydantic>=2.13.4",
    "fire",
    "mcp[cli]>=1.28.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "groq>=1.5.0",
]

[project.scripts]
sandbox = "sandbox.cli:main"
sandbox_mbpp = "sandbox_mbpp.cli:main"

[tool.uv]
package = true
link-mode = "copy" 
